<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}DataFlow INF232{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root {
    --bg: #0a0e17;
    --surface: #111827;
    --surface2: #1a2235;
    --border: rgba(255,255,255,0.07);
    --text: #e8eaf0;
    --muted: #6b7280;
    --sante: #e74c3c;
    --education: #3b82f6;
    --agriculture: #22c55e;
    --accent: #f59e0b;
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    background-image: radial-gradient(ellipse at 20% 20%, rgba(59,130,246,0.04) 0%, transparent 60%),
                      radial-gradient(ellipse at 80% 80%, rgba(34,197,94,0.04) 0%, transparent 60%);
  }
  nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1rem 2rem;
    background: rgba(17,24,39,0.8);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100;
  }
  .nav-brand {
    font-family: 'Syne', sans-serif;
    font-weight: 800; font-size: 1.4rem;
    background: linear-gradient(135deg, #f59e0b, #ef4444);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    text-decoration: none;
  }
  .nav-links { display: flex; gap: 0.5rem; }
  .nav-links a {
    color: var(--muted); text-decoration: none;
    padding: 0.4rem 1rem; border-radius: 8px; font-size: 0.9rem;
    transition: all 0.2s;
  }
  .nav-links a:hover { color: var(--text); background: var(--surface2); }
  .badge {
    display: inline-block; padding: 0.2rem 0.6rem;
    border-radius: 20px; font-size: 0.75rem; font-weight: 500;
    background: rgba(245,158,11,0.15); color: var(--accent);
    border: 1px solid rgba(245,158,11,0.3);
  }
  main { padding: 2rem; max-width: 1200px; margin: 0 auto; }
  .btn {
    display: inline-flex; align-items: center; gap: 0.5rem;
    padding: 0.75rem 1.5rem; border-radius: 10px; border: none;
    font-family: 'DM Sans', sans-serif; font-size: 0.9rem; font-weight: 500;
    cursor: pointer; text-decoration: none; transition: all 0.2s;
  }
  .btn-primary { background: var(--accent); color: #000; }
  .btn-primary:hover { background: #d97706; transform: translateY(-1px); }
  .btn-outline {
    background: transparent; color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-outline:hover { background: var(--surface2); }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 1.5rem;
  }
  .flash-msg {
    padding: 1rem 1.5rem; border-radius: 10px; margin-bottom: 1rem;
    background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3);
    color: #86efac;
  }
</style>
{% block extra_css %}{% endblock %}
</head>
<body>
<nav>
  <a href="/" class="nav-brand">⬡ DataFlow</a>
  <div class="nav-links">
    <a href="/"><i class="fas fa-home"></i> Accueil</a>
    <a href="/collect/sante"><i class="fas fa-heartbeat"></i> Santé</a>
    <a href="/collect/education"><i class="fas fa-graduation-cap"></i> Éducation</a>
    <a href="/collect/agriculture"><i class="fas fa-seedling"></i> Agriculture</a>
  </div>
  <span class="badge">INF232 EC2</span>
</nav>
<main>
  {% block content %}{% endblock %}
</main>
<script>{% block scripts %}{% endblock %}</script>
</body>
</html>
